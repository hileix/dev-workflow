name: Release Electron App

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS package
        run: pnpm make:desktop

      - name: Prepare stable DMG asset
        run: |
          dmg_path=$(find out/make -maxdepth 1 -name "*.dmg" -print -quit)
          if [ -z "$dmg_path" ]; then
            echo "No DMG artifact found"
            exit 1
          fi
          cp "$dmg_path" out/make/dev-workflow.dmg

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/dev-workflow.dmg
            out/make/zip/darwin/*/*.zip
